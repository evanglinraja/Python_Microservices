{% extends 'base.html' %}
{% block title %}Create Product{% endblock %}

{% block content %}
<h1>Add Product</h1>
<form  method="post">
    {% csrf_token %}
    <label for="">Name</label>
    <input type="text" name="Name" class="form-control mb-4" required>
    <label for="">Price</label>
    <input type="number" name="Price" class="form-control mb-4" required>
    <label for="">Stock</label>
    <input type="number" name="Stock" class="form-control mb-4" required>
    <button type="submit" class="btn btn-success ms-4">Create Product</button>
    <a href="{% url 'product_list' %}" class="btn btn-white shadow ms-4">Back</a>
</form>
{% endblock %}
