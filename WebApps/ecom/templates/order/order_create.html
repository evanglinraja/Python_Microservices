{% extends 'base.html' %}
{% block title %}Create Order{% endblock %}

{% block content %}
<h1>Create Order</h1>
<form method="post">
    {% csrf_token %}
   <label for="">Product Id</label>
    <input type="number" name="ProductId" class="form-control mb-3" required>
    <label for="">Quantity</label>
    <input type="number" name="Quantity" class="form-control mb-3" required>
    <label for="">Total Price</label>
    <input type="number" name="TotalPrice" class="form-control mb-3" required>
    <button type="submit" class="btn btn-success">Create Order</button>
    <a href="{% url 'order_list' %}" class="btn btn-white shadow ms-3">Back</a>
</form>
{% endblock %}
