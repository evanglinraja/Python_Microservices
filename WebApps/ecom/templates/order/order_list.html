{% extends 'base.html' %}
{% block title %}Orders{% endblock %}

{% block content %}
<h1>Orders</h1>
<a href="{% url 'order_create' %}" class="btn btn-success mb-4">Create Order</a>
<table class="table table-bordered table-striped">
    <thead class="table-dark">
        <tr>
            <th>Product Id</th>
            <th>Quantity</th>
            <th>Total Price</th>
            <th>Actions</th>
        </tr>

    </thead>
    <tbody>
        {% for order in orders %}
        <tr>
            <td>{{ order.ProductId }}</td>
            <td>{{ order.Quantity }}</td>
            <td>{{ order.TotalPrice }}</td>
            <td>
                <a href="{% url 'order_edit' order.Id %}">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#5985E1"><path d="M200-200h57l391-391-57-57-391 391v57Zm-80 80v-170l528-527q12-11 26.5-17t30.5-6q16 0 31 6t26 18l55 56q12 11 17.5 26t5.5 30q0 16-5.5 30.5T817-647L290-120H120Zm640-584-56-56 56 56Zm-141 85-28-29 57 57-29-28Z"/></svg>
                </a>
                <form method="post" action="{% url 'order_delete' order.Id %}" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" style="border: none; background: none;" onclick="return confirm('Are you sure you want to delete this order?')">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#EA3323"><path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/></svg>
                    </button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
